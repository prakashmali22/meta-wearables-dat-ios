name: VoiceFormFill
options:
  bundleIdPrefix: com.meta.wearables
  deploymentTarget:
    iOS: "17.2"
  createIntermediateGroups: true
packages:
  meta-wearables-dat-ios:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  VoiceFormFill:
    type: application
    platform: iOS
    sources:
      - path: VoiceFormFill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meta.wearables.voiceformfill
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VoiceFormFill/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: meta-wearables-dat-ios
        product: MWDATCore
      - package: meta-wearables-dat-ios
        product: MWDATSpeech
      - package: meta-wearables-dat-ios
        product: MWDATDisplay
      - package: meta-wearables-dat-ios
        product: MWDATMockDevice
  VoiceFormFillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VoiceFormFillTests
    dependencies:
      - target: VoiceFormFill
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
schemes:
  VoiceFormFill:
    build:
      targets:
        VoiceFormFill: all
    test:
      targets:
        - VoiceFormFillTests
